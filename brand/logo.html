<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:transparent}
  .wrap{display:inline-block}
  svg{display:block}
</style></head>
<body>
<div class="wrap" id="seal-wrap">
<svg id="seal" width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1b3b36"/><stop offset=".7" stop-color="#0e2421"/><stop offset="1" stop-color="#081614"/>
    </radialGradient>
    <radialGradient id="parch" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#f4ead0"/><stop offset=".7" stop-color="#e7d6ad"/><stop offset="1" stop-color="#cfb685"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d98a"/><stop offset=".45" stop-color="#c8963a"/><stop offset=".75" stop-color="#e9c46f"/><stop offset="1" stop-color="#9b6f22"/>
    </linearGradient>
    <path id="arcTop" d="M 540 540 m -372 0 a 372 372 0 1 1 744 0"/>
    <path id="arcBot" d="M 540 540 m -404 0 a 404 404 0 0 0 808 0"/>
    <symbol id="spark" viewBox="-50 -50 100 100"><path fill="url(#gold)" stroke="#8a6420" stroke-width="1" d="M0 -50L1.8 -4L9.2 -9.2L4 -1.8L32 0L4 1.8L9.2 9.2L1.8 4L0 50L-1.8 4L-9.2 9.2L-4 1.8L-32 0L-4 -1.8L-9.2 -9.2L-1.8 -4Z"/></symbol>
    <symbol id="rose" viewBox="-13 -13 26 26"><g fill="#efe2c2" stroke="#6e5230" stroke-width="1"><path d="M0 -11C6 -12 11 -7 11 -1C12 5 7 11 0 11C-7 11 -12 5 -11 -1C-11 -7 -6 -12 0 -11Z"/><path d="M-7 -3C-6 -8 6 -8 7 -3C8 3 3 7 0 7C-4 7 -8 3 -7 -3Z"/><path d="M-3 -1C-3 -4 3 -4 3 -1C3 2 0 3 -1 2" fill="none"/></g></symbol>
    <symbol id="blossom" viewBox="-10 -10 20 20"><g fill="#efe2c2" stroke="#6e5230" stroke-width=".9"><ellipse cy="-5" rx="3.4" ry="4.6"/><ellipse cy="-5" rx="3.4" ry="4.6" transform="rotate(72)"/><ellipse cy="-5" rx="3.4" ry="4.6" transform="rotate(144)"/><ellipse cy="-5" rx="3.4" ry="4.6" transform="rotate(216)"/><ellipse cy="-5" rx="3.4" ry="4.6" transform="rotate(288)"/><circle r="2.4" fill="#c9a869"/></g></symbol>
    <symbol id="leaf" viewBox="0 -5 18 10"><path d="M0 0C4 -5 12 -5 18 0C12 5 4 5 0 0Z" fill="#e6d6ad" stroke="#6e5230" stroke-width=".9"/><path d="M1 0L16 0" stroke="#6e5230" stroke-width=".6"/></symbol>
  </defs>

  <!-- outer dark field -->
  <circle cx="540" cy="540" r="530" fill="url(#bg)"/>
  <!-- gold outer ring -->
  <circle cx="540" cy="540" r="512" fill="none" stroke="url(#gold)" stroke-width="14"/>
  <circle cx="540" cy="540" r="494" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <!-- lettering band -->
  <circle cx="540" cy="540" r="486" fill="#12302b"/>
  <circle cx="540" cy="540" r="486" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <text font-family="Cinzel, serif" font-weight="800" font-size="82" letter-spacing="10" fill="url(#gold)" text-anchor="middle">
    <textPath href="#arcTop" startOffset="50%">CORVIDZZ PUZZLES</textPath>
  </text>
  <text font-family="Cinzel, serif" font-weight="700" font-size="46" letter-spacing="9" fill="#efe2c2" text-anchor="middle">
    <textPath href="#arcBot" startOffset="50%">CAN YOU DECODE THIS?</textPath>
  </text>
  <!-- stars dividing top and bottom text -->
  <use href="#spark" x="68" y="508" width="44" height="64"/>
  <use href="#spark" x="968" y="508" width="44" height="64"/>

  <!-- parchment medallion -->
  <circle cx="540" cy="540" r="318" fill="url(#bg)"/>
  <circle cx="540" cy="540" r="316" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <circle cx="540" cy="540" r="300" fill="url(#parch)"/>
  <circle cx="540" cy="540" r="300" fill="none" stroke="#9c7f4c" stroke-width="2"/>
  <circle cx="540" cy="540" r="290" fill="none" stroke="#9c7f4c" stroke-width="1"/>

  <!-- engraved garland around the inside of the medallion -->
  <g id="garland"></g>

  <!-- raven holding a golden key -->
  <g transform="translate(530 548) scale(3.5) translate(-56 -58)">
    <path fill="#1f1a14" d="M105 31 L89 24 C85 18 77 15 70 17 C61 19 55 26 51 34 C43 46 31 58 21 70 L5 90 L13 93 L30 81 C38 79 47 77 55 75 L57 83 L51 93 L55 93 L59 85 L61 93 L65 93 L62 81 C69 73 75 63 76 55 L81 51 L77 48 L83 45 L79 42 L85 39 L87 35 Z"/>
    <circle cx="79" cy="24" r="1.8" fill="#f4ead0"/>
    <g fill="none" stroke="#f4ead0" stroke-linecap="round" opacity=".45">
      <path d="M55 38 C60 50 56 62 36 76" stroke-width="1.1"/>
      <path d="M50 50 C48 58 42 66 30 74" stroke-width=".9"/>
      <path d="M45 58 C40 66 34 70 24 76" stroke-width=".8"/>
    </g>
    <!-- branch the raven perches on -->
    <path d="M18 95 C40 92 70 93 100 90" stroke="#6e5230" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M86 91 C90 86 96 85 100 86" stroke="#6e5230" stroke-width="1.4" fill="none"/>
    <use href="#leaf" x="92" y="80" width="12" height="7" transform="rotate(-20 98 84)"/>
    <use href="#leaf" x="22" y="90" width="12" height="7" transform="rotate(200 28 94)"/>
    <!-- key hanging from the beak -->
    <g transform="translate(99 32) rotate(78)" fill="none" stroke="#d6a445" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="4.4" stroke-width="2.4"/>
      <circle cx="0" cy="0" r="1.4" stroke-width="1"/>
      <path d="M4.4 0 L26 0" stroke-width="2.6"/>
      <path d="M21 0 L21 5.5 L24 5.5 M26 0 L26 6" stroke-width="2.2"/>
    </g>
  </g>

  <!-- small stars in the medallion -->
  <use href="#spark" x="690" y="330" width="30" height="46"/>
  <use href="#spark" x="370" y="370" width="20" height="30"/>
</svg>
</div>

<div class="wrap" id="banner-wrap" style="margin-top:20px">
<svg id="banner" width="2400" height="800" viewBox="0 0 2400 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="2400" height="800" fill="#0e2421"/>
  <rect width="2400" height="800" fill="url(#bannerGlow)"/>
  <defs>
    <radialGradient id="bannerGlow" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#1d3f39"/><stop offset="1" stop-color="#0e2421" stop-opacity="0"/></radialGradient>
  </defs>
  <image id="seal-in-banner" x="160" y="100" width="600" height="600"/>
  <text x="880" y="385" font-family="Cinzel, serif" font-weight="800" font-size="150" letter-spacing="6" fill="url(#gold)">CORVIDZZ</text>
  <text x="880" y="545" font-family="Cinzel, serif" font-weight="700" font-size="110" letter-spacing="22" fill="#efe2c2">PUZZLES</text>
  <line x1="886" y1="600" x2="2180" y2="600" stroke="#c8963a" stroke-width="3"/>
  <use href="#spark" x="2190" y="572" width="36" height="56"/>
  <text x="886" y="668" font-family="IM Fell English, serif" font-style="italic" font-size="58" fill="#e7d6ad">Fairy-tale puzzle books · corvidzz.com</text>
</svg>
</div>

<script>
  // draw the engraved garland just inside the medallion
  const g = document.getElementById('garland'), NS = 'http://www.w3.org/2000/svg';
  const cx = 540, cy = 540, R = 268;
  const add = (href, x, y, w, h, rot) => { const u = document.createElementNS(NS, 'use'); u.setAttribute('href', href); u.setAttribute('width', w); u.setAttribute('height', h); u.setAttribute('transform', `translate(${x} ${y}) rotate(${rot}) translate(${-w/2} ${-h/2})`); g.appendChild(u); };
  const vine = document.createElementNS(NS, 'path'); let d = '';
  for (let i = 0; i <= 360; i += 2) { const a = i * Math.PI / 180, r = R + Math.sin(i / 8) * 5; d += (i ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy + r * Math.sin(a)).toFixed(1); }
  vine.setAttribute('d', d + 'Z'); vine.setAttribute('fill', 'none'); vine.setAttribute('stroke', '#6e5230'); vine.setAttribute('stroke-width', '2'); g.appendChild(vine);
  for (let i = 0; i < 360; i += 7.5) {
    const a = i * Math.PI / 180, x = cx + R * Math.cos(a), y = cy + R * Math.sin(a), deg = i + 90;
    add('#leaf', x, y, 30, 17, deg + (i % 15 ? 40 : -40));
    if (i % 22.5 === 0) add(i % 45 === 0 ? '#rose' : '#blossom', x, y, i % 45 === 0 ? 38 : 28, i % 45 === 0 ? 38 : 28, deg);
  }
</script>
</body></html>
